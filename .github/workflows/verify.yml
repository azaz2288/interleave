name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q interleave examples tests
      - run: python -m pip install --index-url https://pypi.org/simple -r requirements-dev.txt
      - run: ruff check interleave examples tests tools
      - run: ruff format --check interleave examples tests tools
      - run: python -m examples.lost_update
      - run: python -m pip install .
      - run: python tools/installed_check.py
